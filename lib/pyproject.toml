[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-mongodb-connector"
version = "1.0.0"
description = "Conector Ruvic de solo lectura para MongoDB"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.6,<5.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_mongodb_connector*"]
